<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Star Clicker</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@600;700&display=swap');
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: 'Inter', sans-serif;
  user-select: none;
  -webkit-user-select: none;
  -ms-user-select: none;
  -webkit-touch-callout: none;
}
img, button {
  -webkit-user-drag: none;
  user-drag: none;
}
body {
  background: linear-gradient(180deg,#0d0d0f 0%,#141519 100%);
  color: #fff;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  height: 100vh;
  overflow: hidden;
}
#loader {
  position: fixed; top: 0; left: 0; width: 100%; height: 100%;
  background: #0f0f12;
  display: flex; align-items: center; justify-content: center; flex-direction: column;
  z-index: 100;
}
.loader-bar {width:80%;height:6px;background:#1a1b20;border-radius:10px;overflow:hidden;margin-top:15px;}
.loader-progress {width:0%;height:100%;background:linear-gradient(90deg,#0066ff,#00bfff);transition:width 0.3s ease;}
#app {display:none;flex-direction:column;align-items:center;width:100%;height:100%;}
.header {width:100%;padding:15px;display:flex;justify-content:space-between;align-items:center;background:#101114;}
.profile {display:flex;align-items:center;gap:10px;}
.avatar {width:36px;height:36px;border-radius:50%;background:#0077ff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:18px;text-transform:uppercase;overflow:hidden;}
.avatar img {width:100%;height:100%;object-fit:cover;}
.nickname {font-weight:700;}
.balance {display:flex;align-items:center;gap:6px;font-size:16px;font-weight:700;background:#1b1c21;padding:6px 12px;border-radius:30px;}
.balance span {color:#ffd54a;}
.main {flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:25px;position:relative;}
.circle {width:180px;height:180px;border-radius:50%;background:radial-gradient(circle at 30% 30%,#0077ff,#0040a0);display:flex;align-items:center;justify-content:center;box-shadow:0 0 30px rgba(0,102,255,0.5);transition:transform 0.1s ease;position:relative;}
.circle:active {transform:scale(0.95);}
.circle img {width:70px;height:70px;}
.floating {position:absolute;font-weight:700;font-size:20px;opacity:1;animation:floatUp 1s ease-out forwards;}
@keyframes floatUp {from{transform:translateY(0);opacity:1;}to{transform:translateY(-60px);opacity:0;}}
.navbar {position:fixed;bottom:0;width:100%;background:#101114;display:flex;justify-content:space-around;align-items:center;padding:10px 0;border-top:1px solid #1b1c21;}
.nav-item {flex:1;text-align:center;color:#888;font-size:13px;cursor:pointer;padding:10px 0;border-radius:12px;margin:0 8px;background:#1b1c21;transition:0.2s;}
.nav-item.active {color:#fff;background:linear-gradient(90deg,#0077ff,#00bfff);}
#withdraw-page {display:none;}
button {background:linear-gradient(90deg,#0077ff,#00bfff);border:none;color:#fff;font-weight:700;border-radius:12px;padding:10px 18px;font-size:14px;}
#withdraw-page button {margin-top:10px;background:linear-gradient(90deg,#1b1c21,#2b2c31);}
#register {position:fixed;top:0;left:0;width:100%;height:100%;background:#0d0d10;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:15px;}
#register input {padding:10px 14px;border-radius:8px;border:none;width:70%;max-width:280px;background:#1b1c21;color:#fff;}
#register label {color:#aaa;font-size:14px;}
#register button {margin-top:10px;width:70%;max-width:280px;}
#avatar-preview {width:60px;height:60px;border-radius:50%;background:#0077ff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:22px;color:#fff;overflow:hidden;}
#avatar-preview img {width:100%;height:100%;object-fit:cover;}

/* кнопка звёздной лихорадки — теперь внизу, по центру */
#fever-btn {
  position: fixed;
  bottom: 70px; /* чуть выше навбара */
  left: 50%;
  transform: translateX(-50%);
  background: linear-gradient(90deg,#0040ff,#00aaff);
  border: none;
  color: #fff;
  font-weight: 700;
  border-radius: 12px;
  padding: 10px 20px;
  font-size: 14px;
  box-shadow: 0 0 15px rgba(0,100,255,0.5);
  transition: all 0.3s ease;
  z-index: 10;
}
#fever-btn.active {
  background: linear-gradient(90deg,#ff9500,#ff5e00);
  animation: pulse 1s infinite;
}
@keyframes pulse {
  0% { box-shadow: 0 0 10px #ff9500; }
  50% { box-shadow: 0 0 25px #ff5e00; }
  100% { box-shadow: 0 0 10px #ff9500; }
}
</style>
</head>
<body>
<div id="loader"><div>Loading...</div><div class="loader-bar"><div class="loader-progress" id="loader-progress"></div></div></div>

<div id="register">
  <div id="avatar-preview">A</div>
  <input type="text" id="nickname" placeholder="Введите ник">
  <label>Загрузите фото:</label>
  <input type="file" id="avatar" accept="image/*">
  <button id="register-btn">Продолжить</button>
</div>

<div id="app">
  <div class="header">
    <div class="profile">
      <div class="avatar" id="user-avatar">A</div>
      <div class="nickname" id="user-nick">User</div>
    </div>
    <div class="balance">⭐ <span id="stars">0.0</span></div>
  </div>

  <div class="main" id="clicker">
    <button id="fever-btn">⭐ Звёздная лихорадка</button>
    <div class="circle" id="circle"><img src="https://cdn-icons-png.flaticon.com/512/1828/1828884.png"></div>
  </div>

  <div class="main" id="withdraw-page">
    <h3>🚧 Ведутся технические работы</h3>
    <button id="back">Назад</button>
  </div>

  <div class="navbar">
    <div class="nav-item active" id="nav-clicker">⭐ Кликер</div>
    <div class="nav-item" id="nav-withdraw">💰 Вывод</div>
  </div>
</div>

<script>
const loader=document.getElementById('loader'),progress=document.getElementById('loader-progress');
let load=0;const int=setInterval(()=>{load+=10;progress.style.width=load+"%";if(load>=100){clearInterval(int);loader.style.display='none';checkUser();}},200);

const reg=document.getElementById('register'),avatarInput=document.getElementById('avatar'),avatarPrev=document.getElementById('avatar-preview'),nicknameInput=document.getElementById('nickname'),regBtn=document.getElementById('register-btn');
avatarInput.onchange=()=>{const f=avatarInput.files[0];if(f){const r=new FileReader();r.onload=e=>{avatarPrev.innerHTML=`<img src="${e.target.result}">`};r.readAsDataURL(f);}};

regBtn.onclick=()=>{const nick=nicknameInput.value.trim()||"User";let avatarData="";if(avatarInput.files.length>0){const r=new FileReader();r.onload=e=>{avatarData=e.target.result;saveUser(nick,avatarData);};r.readAsDataURL(avatarInput.files[0]);}else{const c=document.createElement('canvas');c.width=60;c.height=60;const ctx=c.getContext('2d');ctx.fillStyle="#0077ff";ctx.fillRect(0,0,60,60);ctx.fillStyle="#fff";ctx.font="bold 30px Inter";ctx.textAlign="center";ctx.textBaseline="middle";ctx.fillText(nick[0].toUpperCase(),30,33);avatarData=c.toDataURL();saveUser(nick,avatarData);}};

function saveUser(nick,a){const u={nick,avatar:a,stars:parseFloat(localStorage.getItem('stars')||'0'),lastFever:localStorage.getItem('lastFever')||0};localStorage.setItem('user',JSON.stringify(u));reg.style.display='none';loadUser();document.getElementById('app').style.display='flex';}
function checkUser(){const u=localStorage.getItem('user');if(u){loadUser();reg.style.display='none';document.getElementById('app').style.display='flex';}}
function loadUser(){const u=JSON.parse(localStorage.getItem('user'));document.getElementById('user-nick').textContent=u.nick;document.getElementById('user-avatar').innerHTML=`<img src="${u.avatar}">`;stars=parseFloat(u.stars||0);lastFever=parseInt(u.lastFever||0);starsEl.textContent=stars.toFixed(1);updateFeverButton();}

let stars=parseFloat(localStorage.getItem('stars')||'0'),starsEl=document.getElementById('stars'),feverActive=false,lastFever=0;
const circle=document.getElementById('circle');
circle.onclick=()=>{let add=(Math.random()*(0.3-0.1)+0.1);if(feverActive)add*=2;stars+=add;starsEl.textContent=stars.toFixed(1);
  const u=JSON.parse(localStorage.getItem('user'));u.stars=stars;localStorage.setItem('user',JSON.stringify(u));
  const float=document.createElement('div');float.classList.add('floating');float.textContent=`+${add.toFixed(1)}⭐${feverActive?'!':''}`;
  float.style.color=feverActive?'#ff6b00':'#ffd54a';
  const offsetX=(Math.random()*60-30),offsetY=(Math.random()*60-30);
  float.style.left=`calc(50% + ${offsetX}px)`;float.style.top=`calc(50% + ${offsetY}px)`;
  circle.appendChild(float);setTimeout(()=>float.remove(),1000);
};

const feverBtn=document.getElementById('fever-btn');
feverBtn.onclick=()=>{if(feverActive)return;const now=Date.now(),u=JSON.parse(localStorage.getItem('user'));if(now-(u.lastFever||0)<86400000){alert("Лихорадка будет доступна позже!");return;}
  feverActive=true;feverBtn.classList.add('active');feverBtn.textContent="🔥 Лихорадка активна!";
  setTimeout(()=>{feverActive=false;feverBtn.classList.remove('active');feverBtn.textContent="⭐ Звёздная лихорадка";
  const uu=JSON.parse(localStorage.getItem('user'));uu.lastFever=Date.now();localStorage.setItem('user',JSON.stringify(uu));updateFeverButton();},60000);
};
function updateFeverButton(){const u=JSON.parse(localStorage.getItem('user'));const now=Date.now();if(now-(u.lastFever||0)<86400000){feverBtn.disabled=true;feverBtn.style.opacity='0.5';const remain=86400000-(now-u.lastFever);const h=Math.floor(remain/3600000);const m=Math.floor((remain%3600000)/60000);feverBtn.textContent=`⏳ Через ${h}ч ${m}м`;setTimeout(updateFeverButton,60000);}else{feverBtn.disabled=false;feverBtn.style.opacity='1';feverBtn.textContent="⭐ Звёздная лихорадка";}}
document.getElementById('nav-clicker').onclick=()=>{document.getElementById('clicker').style.display='flex';document.getElementById('withdraw-page').style.display='none';document.getElementById('nav-clicker').classList.add('active');document.getElementById('nav-withdraw').classList.remove('active');};
document.getElementById('nav-withdraw').onclick=()=>{document.getElementById('clicker').style.display='none';document.getElementById('withdraw-page').style.display='flex';document.getElementById('nav-withdraw').classList.add('active');document.getElementById('nav-clicker').classList.remove('active');};
document.getElementById('back').onclick=()=>{document.getElementById('nav-clicker').click();};
</script>
</body>
</html>
